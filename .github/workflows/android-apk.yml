name: Generar APK de escalas

on:
  workflow_dispatch:
  push:
    branches: [main, codex/android-apk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar herramientas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Incluir guitarra real sin conexión
        run: python3 android/prepare_samples.py
      - name: Compilar y revisar
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Escalas-Flamencas-1.0-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Escalas-Flamencas-APK
          path: Escalas-Flamencas-1.0-prueba.apk
          if-no-files-found: error
          retention-days: 30
